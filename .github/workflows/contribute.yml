name: Update Contributors List

on:
  # Runs whenever a PR is merged into main
  pull_request_target:
    types: [closed]
    branches: [main]
  # Also runs once a week, in case a commit landed without a PR
  schedule:
    - cron: '0 0 * * 0'
  # Lets you trigger it manually from the Actions tab to test it
  workflow_dispatch:

jobs:
  add-contributors:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: akhilmhdh/contributors-readme-action@v2.3.10
        with:
          image_size: 80
          columns_per_row: 6
          commit_message: 'docs: update contributors list'
          auto_detect_branch_protection: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}